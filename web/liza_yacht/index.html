<!DOCTYPE html>
<html>
	<head>
		<title>rawr</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="https://raw.githubusercontent.com/r4wmil/liyacht_images/refs/heads/main/styles.css">
	</head>
	<style>
		:root {
			--bg: #d9d9d9;
		}
		html {
			scroll-behaviour: smooth;
		}
		html, body {
			overflow-x: clip;
		}
		/* --- WELCOME PANE --- */
		.r_pane {
			/*display: flex;
			flex-direction: column;
			gap: 70px;*/
			justify-content: center;
			align-items: center;
			width: 100%;
			height: 100vh;
			min-height: 0;
			background: no-repeat center/cover var(--bg);
			/*box-shadow: inset 0 0 0 100vmax rgba(255,255,255,0.45);*/
			/*padding: 64px 24px 48px 24px;*/
			padding: 0px;
			box-sizing: border-box; /* No shrinking */
			object-fit: contain;
			position: relative;
		}
		.r_pane_wrap {
			position: absolute;
			top: 50%;
			transform: translateY(-50%);
			width: 100%;
			height: 100%;
		}
		.r_centering {
			position: absolute;
			width: 100%;
			height: 100%;
			top: 0;
			left: 0;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		@media (max-width: 600px) {
			#r_pane1 .r_centering > div {
				flex-direction: column;
			}

			#r_pane1 .r_centering > div > div {
				width: 90% !important;
				text-align: center !important;
			}
		}
		.r_welcome {
			display: block;
			color: var(--text);
			font-size: 8vw;
			transform: skewY(15deg);
			animation: w-pingpong-whole 7.5s ease-in-out infinite;
		}
		@media (max-width: 600px) {
			.r_welcome {
				font-size: 18vw;
			}
		}
		.r_welcome span {
			display: inline-block;
			font-family: LibertinusSerif;
			animation: w-pingpong 2.5s ease-in-out infinite;
			text-shadow: -0.07em -0.07em var(--text-muted);
			transform: translateY(0.4em);
			opacity: 0.5;
		}
		.r_welcome span:nth-child(1) { animation-delay: 0.0s; }
		.r_welcome span:nth-child(2) { animation-delay: 0.2s; }
		.r_welcome span:nth-child(3) { animation-delay: 0.4s; }
		.r_welcome span:nth-child(4) { animation-delay: 0.6s; }
		.r_welcome span:nth-child(5) { animation-delay: 0.8s; }
		.r_welcome span:nth-child(6) { animation-delay: 1.0s; }
		.r_welcome span:nth-child(7) { animation-delay: 1.2s; }
		.r_welcome span:nth-child(8) { animation-delay: 1.4s; }
		@keyframes w-pingpong {
			0%, 100% {
				transform: translateY(0.4em);
				text-shadow: -0.07em -0.07em 0.0em var(--text-muted);
				opacity: 0.5;
			}
			50% {
				transform: translateY(-0.4em);
				text-shadow: 0.07em 0.07em 0.0em var(--text-muted);
				opacity: 1.0;
			}
		}
		@keyframes w-pingpong-whole {
			0%, 100% {
				transform: skewY(12deg);
			}
			50% {
				transform: skewY(-12deg);
			}
		}
		.r_splash {
			font-family: NotoSans;
			font-size: 1em;
			text-align: center;
			color: var(--text-muted);
		}
		/* --- Links --- */
		.r_content {
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			background: white !important;
		}
	</style>
	<body>
		<div id="r_pane0" class="r_pane">
			<div class="r_centering">
				<div style="position: relative; width: 100%;">
					<img id="yacht_bg" src="https://raw.githubusercontent.com/r4wmil/liyacht_images/refs/heads/main/d0.jpg" style="display: block; width: 100%; height: auto;">

					<img id="obj_yacht" src="https://raw.githubusercontent.com/r4wmil/liyacht_images/refs/heads/main/d0.png" style="position: absolute; left: 0%; top: 60%; width: 15%; height: auto; transform: translate(-50%, -50%);">
				</div>
			</div>
		</div>
		<div id="r_pane1" class="r_pane" style="height: 200vh;">
			<div style="position: sticky; top: 0; height: 100vh;">
				<div class="r_centering">
					<div style="display: flex; align-items: center; justify-content: center; gap: 5vw; width: 90%;">

						<div style="width: 40%; text-align: right;">
							<h1>Big yacht</h1>
							<p>Your text goes here.</p>
						</div>

						<div id="obj_big_yacht" style="position: relative; width: 50%;">
							<div style="
													position: absolute;
													right: 50%;
													top: 0;
													width: 50vw;
													height: 100%;
													background: var(--bg);
													z-index: 0;
													"></div>

							<img src="https://raw.githubusercontent.com/r4wmil/liyacht_images/refs/heads/main/big_yacht.svg"
									 style="display: block; width: 100%; height: auto; position: relative; z-index: 1;">
						</div>
					</div>
				</div>
			</div>
		</div>
		<!--<footer>
			<span class="r_footer_copyright">
				тут чёта © 2026
			</span>
		</footer>-->
	</body>
	<script>
		// --- YACHT SMALL ---
		var yacht_targ = -7;
		var yacht_curr = -7;
		function yacht_set(v) {
			yacht_targ = Math.min(420 + v * 0.95, 950);
		}
		yacht_set(scrollY);
		window.addEventListener("scroll", () => { yacht_set(scrollY); });
		function yacht_animate() {
			const maxStep = 2.5;
			const diff = yacht_targ - yacht_curr;
			var diff_delay_fact = Math.min(Math.abs(diff), 100.0) / 100.0;
			yacht_curr += Math.sign(diff) * Math.min(Math.abs(diff), maxStep) * diff_delay_fact;
			var x = yacht_curr;
			var y = Math.sin(yacht_curr / 20.0);
			obj_yacht.style.transform = `translate(${x}%, ${y}%)`;
			requestAnimationFrame(yacht_animate);
		}
		yacht_animate();
		// --- YACHT BIG ---
		let big_targ = -100;
		let big_curr = -100;
		function big_set() {
			const passed = scrollY > r_pane1.offsetTop + r_pane1.firstElementChild.offsetHeight - 10;
			big_targ = passed ? 0 : -250;
		}

		window.addEventListener("scroll", big_set);
		window.addEventListener("resize", big_set);
		big_set();

		function big_animate() {
			const diff = big_targ - big_curr;
			big_curr += diff * 0.04;

			var x = big_curr;
			var y = Math.sin(big_curr / 8.0);
			obj_big_yacht.style.transform = `translate(${x}%, ${y}%)`;

			requestAnimationFrame(big_animate);
		}

		big_animate();
	</script>
</html>
