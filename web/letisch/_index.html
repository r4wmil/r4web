<script>

	window.addEventListener('load', function() {

				if (!response.ok) { throw new Error('Network response was not ok'); }
				return response.json();
			})
			.then(data => {
				alert(data);
			})
			.catch(error => {
				console.error('Error:', error);
			});
	});
</script>
