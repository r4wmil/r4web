<div class="r_content">
	<div class="r_box" style="word-wrap: break-word;">
		<h2>
			<span class="lang_en">Schedule ETU "LETI"</span>
			<span class="lang_ru">Расписание ЛЭТИ</span>
		</h2>
		<p>
			<span>
				<select id="depts_dropdown"></select>,
				<select id="teachers_dropdown"></select>
			</span>
		</p>
		<p>Преподаватель: <span id="sch_teacher"></span></p>
		<p>
			<span id="sch_dump"></span>
		</p>
	</div>
</div>
<script src="/enums.js"></script>
<script src="/utils/binary_rw.js"></script>
<script>
	// Run when page loads
	function What2Time(timeValue) {
		if (timeValue < 1000) {
			switch (timeValue % 10) {
				case 0: return '8:00'; break;
				case 1: return '9:50'; break;
				case 2: return '11:40'; break;
				case 3: return '13:40'; break;
				case 4: return '15:30'; break;
				case 5: return '17:20'; break;
			}
		} else {
			switch (timeValue % 10) {
				case 0: return '9:30'; break;
				case 1: return '11:20'; break;
				case 2: return '13:10'; break;
				case 3: return '15:10'; break;
				case 4: return '17:00'; break;
				case 5: return '18:50'; break;
			}
		}
		return '??:??';
	}
	function WeekDayToRu(weekDay) {
		switch (weekDay) {
			case 'MON': return 'Понедельник'; break;
			case 'TUE': return 'Вторник'; break;
			case 'WED': return 'Среда'; break;
			case 'THU': return 'Четверг'; break;
			case 'FRI': return 'Пятница'; break;
			case 'SAT': return 'Суббота'; break;
			case 'SUN': return 'Воскресенье'; break;
		}
		return '??:??';
	}
	function GetLessonId(lesson) {
		return ""
			+ lesson.auditoriumReservation.reservationTime.weekDay
			+ lesson.auditoriumReservation.reservationTime.startTime
			+ lesson.teacher.id
			+ lesson.auditoriumReservation.auditoriumNumber;
	}
	function InitDeptList() {
		depts_dropdown.innerHTML += `<option value="-1">(не выбран)</option>`;

	}
	function GetDeptList() {
		fetch(`/letisch/depts`)
			.then(resp => resp.json())
			.then(buf => {
				depts_dropdown.innerHTML = "";
				depts_dropdown.innerHTML += `<option value="-1">(не выбран)</option>`;
				for (let i = 0; i < buf.length; i++) {
					var dept = buf[i];
					if (dept.title.length == 0) { continue; }
					if (!dept.faculty) { continue; }
					depts_dropdown.innerHTML += `<option value="${dept.id}">${dept.title} (${dept.faculty.title})</option>`;
				}
			});
	}
	var teacher_names = [];
	function GetTeacherList(dept_id) {
		teacher_names = [];
		fetch(`/letisch/teacher_list?dept_id=${dept_id}`)
			.then(resp => resp.json())
			.then(buf => {
				buf.sort((a, b) => a.initials.localeCompare(b.initials));
				teachers_dropdown.innerHTML = "";
				teachers_dropdown.innerHTML += `<option value="-1">(не выбран)</option>`;
				for (let i = 0; i < buf.length; i++) {
					var teacher = buf[i];
					teachers_dropdown.innerHTML += `<option value="${teacher.id}">${teacher.initials}</option>`;
					teacher_names.push(`${teacher.surname} ${teacher.name} ${teacher.midname}`);
				}
			});
	}
	function SendRequest(teacherId) {
		fetch(`/letisch/teacher?id=${teacherId}`)
			.then(resp => resp.json())
			.then(buf => {
				//alert(JSON.stringify(buf));
				var s = '';
				var lesson_arr = {'MON':[],'TUE':[],'WED':[],'THU':[],'FRI':[],'SAT':[],'SUN':[]};
				var lesson_info = {};
				var teacher_name = "";
				for (let i = 0; i < buf.length; i++) {
					var lessons = buf[i]["scheduleObjects"];
					for (let j = 0; j < lessons.length; j++) {
						var lesson = lessons[j]["lesson"];
						var lessonId = GetLessonId(lesson);
						if (!lesson_info[lessonId]) {
							lesson_info[lessonId] = {"shown":0,"groups":{},"weeks":0}
						}
						lesson_info[lessonId].weeks += lesson.auditoriumReservation.reservationTime.week;
						lesson_info[lessonId].groups[lesson.groupNumber] = 1;
						var weekDay = lesson.auditoriumReservation.reservationTime.weekDay;
						lesson_arr[weekDay].push(lesson);
					}
				}
				var flag = 0;
				for (let key in lesson_arr) {
					if (lesson_arr[key].length != 0) { flag = 1; }
				}
				if (!flag) { sch_dump.innerHTML = "У препода нет пар походу, бро"; return; }
				for (let key in lesson_arr) {
					if (lesson_arr[key].length == 0) { continue; }
					lesson_arr[key].sort((a, b) => a.auditoriumReservation.reservationTime.startTime - b.auditoriumReservation.reservationTime.startTime);
					s += `<h3>${WeekDayToRu(key)}: </h3>`;
					for (let j = 0; j < lesson_arr[key].length; j++) {
						var lesson = lesson_arr[key][j];
						var lessonId = GetLessonId(lesson);
						var lessonInfo = lesson_info[lessonId];
						if (lessonInfo.shown == 1) { continue; }
						lessonInfo.shown = 1;
						var startTime = lesson.auditoriumReservation.reservationTime.startTime;
						var endTime = lesson.auditoriumReservation.reservationTime.endTime;
						s += `${What2Time(startTime)} - ${What2Time(endTime)}, `;
						var w = lessonInfo.weeks;
						s += `Недели: ${w == 1 ? "1" : (w == 2 ? "2" : "1, 2")}`;
						s += "<br>"
						s += `<b>${lesson.subject.subjectType}:</b> `;
						s += `${lesson.subject.shortTitle} `;
						s += `(${lesson.subject.title}) `;
						s += "<br>"
						s += `Ауд. ${lesson.auditoriumReservation.auditoriumNumber}, `;
						s += lesson.teacher.initials;
						if (lesson.secondTeacher) {
							s += `, ${lesson.secondTeacher.initials}`;
						}
						s += "<br>"
						s += `Группы: ${Object.keys(lessonInfo.groups)}, `;
						s += "<br>"
						s += "<br>"
					}
				}
				sch_dump.innerHTML = s;
			});
	}
	depts_dropdown.addEventListener('change', function () {
		if (this.value == -1) { return; }
		GetTeacherList(this.value);
	});
	teachers_dropdown.addEventListener('change', function () {
		if (this.value == -1) { return; }
		sch_dump.innerHTML = "";
		SendRequest(this.value);
		sch_teacher.textContent = teacher_names[this.selectedIndex - 1];
	});
	window.addEventListener('load', function() {
		GetDeptList();
	});
</script>
