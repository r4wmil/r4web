		<footer>
			<span class="r_footer_lang">
				<a href="" class="lang_en" onclick="SetLanguage('ru'); return false;">Русский</a>
				<a href="" class="lang_ru" onclick="SetLanguage('en'); return false;">English</a>
			</span>
			•
			<span class="r_footer_copyright">
				<span class="lang_en">Ramil Khasanshin © 2026</span>
				<span class="lang_ru">Рамиль Хасаншин © 2026</span>
			</span>
		</footer>
	</body>
	<script>
		var page_language = "en";
		function QuerySetVisible(selector, state) {
			document.querySelectorAll(selector).forEach(tag => tag.style.display = (state ? 'unset' : 'none'));
		}
		function UpdateLanguage() {
			page_language = localStorage.getItem("language");
			if (page_language === null) {
				page_language = navigator.language.startsWith("ru") ? "ru" : "en";
				page_language = page_language ? "ru" : "en";
			}
			if (page_language == "en") {
				QuerySetVisible(".lang_en", 1);
				QuerySetVisible(".lang_ru", 0);
			} else {
				QuerySetVisible(".lang_en", 0);
				QuerySetVisible(".lang_ru", 1);
			}
		}
		function SetLanguage(new_page_language) {
			page_language = new_page_language;
			localStorage.setItem("language", page_language);
			UpdateLanguage();
		}
		UpdateLanguage();
	</script>
</html>
